apiVersion: tekton.dev/v1beta1
kind: Task
metadata:
  name: cleanup
spec:
  description: This task will clean up a workspace by deleting all of the files from WORKSPACE_SOURCE_PATH.
  workspaces:
    - name: source
  steps:
    - name: remove
      image: alpine:3
      env:
        - name: WORKSPACE_SOURCE_PATH
          value: $(workspaces.source.path)
      workingDir: $(workspaces.source.path)
      securityContext:
        runAsNonRoot: false
        runAsUser: 0
      script: |
        #!/usr/bin/env sh
        set -eu
        echo "Removing all files from WORKSPACE_SOURCE_PATH=${WORKSPACE_SOURCE_PATH} ..."
        # deletes files from WORKSPACE_SOURCE_PATH
        rm -rf "${WORKSPACE_SOURCE_PATH:?}"/*
        rm -rf "${WORKSPACE_SOURCE_PATH:?}"/.[!.]*
        echo "Cleanup of WORKSPACE_SOURCE_PATH completed."

---
apiVersion: tekton.dev/v1beta1
kind: Task
metadata:
  name: nose
spec:
  description: Run unit tests with nose on the specified source code.
  workspaces:
    - name: source
  params:
    - name: args
      description: Arguments to pass to nosetests
      type: string
      default: "-v"
  steps:
    - name: Run unit tests with nose
      image: python:3.9-slim
      workingDir: $(workspaces.source.path)
      script: |
        #!/usr/bin/env sh
        set -e
        echo "Run unit tests with nose"
        python -m pip install --upgrade pip
        if [ -f requirements.txt ]; then
          pip install -r requirements.txt
        fi
        nosetests $(params.args)
